# Rootless Podman on desktop Linux: `podman compose up --build`.
# A sandbox for one person on one desktop, not a way to host the app.
# Every name here carries -v3 so this never shares a project, image, container or data
# folder with a 2.x container from the same machine.
name: civitai-artist-discovery-v3
services:
  app:
    build:
      context: .
      dockerfile: container/Containerfile
    image: localhost/civitai-artist-discovery-v3
    container_name: civitai-artist-discovery-v3
    init: true
    # SIGINT reaches the server's KeyboardInterrupt shutdown; SIGTERM would skip it.
    stop_signal: SIGINT
    # Civitai redirects sign-in to localhost:8765 and the app picks its own loopback
    # port, so both must be the host's own loopback.
    network_mode: host
    # The D-Bus session only accepts the same user ID, and data-dev-3.0/ stays owned by you.
    userns_mode: keep-id
    # SELinux otherwise blocks the container from the host's D-Bus socket.
    security_opt:
      - label=disable
    environment:
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/host-bus
      HOME: /tmp
      CIVITAI_OAUTH_CLIENT_ID: ${CIVITAI_OAUTH_CLIENT_ID:-}
      # The same folder a 3.0 source launch uses; never the 2.x data/ folder.
      CIVITAI_HISTORY_DATA_DIR: /app/data-dev-3.0
    volumes:
      - ${XDG_RUNTIME_DIR:?run this from your desktop session}/bus:/run/host-bus
      - ./data-dev-3.0:/app/data-dev-3.0
